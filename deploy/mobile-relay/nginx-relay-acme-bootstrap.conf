# Bootstrap-only HTTP endpoint for the first ACME certificate issuance.
# Replace relay.seemlab.top when validating a temporary acceptance hostname.

server {
    listen 80;
    listen [::]:80;
    server_name relay.seemlab.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ccb-mobile-relay-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
