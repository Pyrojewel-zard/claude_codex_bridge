# Template only. Do not overwrite an existing nginx, RustDesk, or ZeroTier
# configuration without an operator-reviewed deployment change.
#
# Loopback upstream port 18444 was checked free on the development host for
# Package C on 2026-07-22 with:
#   ss -ltn 'sport = :18444'

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name relay.seemlab.top;

    ssl_certificate /etc/letsencrypt/live/relay.seemlab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.seemlab.top/privkey.pem;
    ssl_protocols TLSv1.3;

    access_log /var/log/nginx/ccb-mobile-relay-access.log;
    error_log /var/log/nginx/ccb-mobile-relay-error.log warn;

    location /healthz {
        proxy_pass https://127.0.0.1:18444/healthz;
        proxy_ssl_verify off;
    }

    location /readyz {
        proxy_pass https://127.0.0.1:18444/readyz;
        proxy_ssl_verify off;
    }

    location /v2/ {
        proxy_pass https://127.0.0.1:18444;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
