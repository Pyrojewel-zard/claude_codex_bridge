# Template only. Do not overwrite an existing nginx, RustDesk, or ZeroTier
# configuration without an operator-reviewed deployment change.
#
# Loopback upstream port 18444 and admin port 18445 were checked free on the
# development host for Package C on 2026-07-22 with:
#   ss -ltn 'sport = :18444'
#   ss -ltn 'sport = :18445'
#
# Do not proxy /healthz, /readyz, or /metrics publicly. Those endpoints live on
# the relay's separate loopback-only admin listener.

map $http_upgrade $ccb_relay_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.seemlab.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ccb-mobile-relay-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name relay.seemlab.top;

    ssl_certificate /etc/letsencrypt/live/relay.seemlab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.seemlab.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ccb-mobile-relay-access.log;
    error_log /var/log/nginx/ccb-mobile-relay-error.log warn;

    location /v2/ {
        proxy_pass https://127.0.0.1:18444;
        proxy_ssl_verify off;
        proxy_ssl_protocols TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ccb_relay_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-CCB-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
